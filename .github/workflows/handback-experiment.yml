name: Installed assignment handback experiment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - run: node --test tests/handback-experiment.test.mjs
      - name: Install exact isolated host
        run: npm install --prefix "$RUNNER_TEMP/loom-handback-host" --no-audit --no-fund @opencode/cli@2.0.29
      - name: Real host, scripted provider, no external inference
        run: >-
          python3 tests/installed_handback_experiment.py
          --opencode "$RUNNER_TEMP/loom-handback-host/node_modules/.bin/opencode"
          --report-directory "$RUNNER_TEMP/loom-handback-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-handback-${{ github.sha }}
          path: ${{ runner.temp }}/loom-handback-report/
          if-no-files-found: warn
          retention-days: 7
