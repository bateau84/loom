name: Installed Stage 3 and Stage 4 learning mechanics
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  session-increments:
    name: Ordinary Session incremental learning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Pack and install the exact incremental-learning candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loom-increment-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/loom-increment-package" > "$RUNNER_TEMP/loom-increment-package/pack.json"
          LOOM_INCREMENT_ARTIFACT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/loom-increment-package/pack.json")
          npm install --prefix "$RUNNER_TEMP/loom-increment-install" --no-audit --no-fund "$RUNNER_TEMP/loom-increment-package/$LOOM_INCREMENT_ARTIFACT"
      - name: Install unmodified pinned OpenCode 2.3.0
        run: npm install --prefix "$RUNNER_TEMP/loom-increment-host" --no-audit --no-fund @opencode/cli@2.3.0
      - name: Qualify incremental evidence across real native idle opportunities
        shell: bash
        run: >-
          python3 tests/installed_incremental_learning.py
          --opencode "$RUNNER_TEMP/loom-increment-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-increment-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-increment-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "$EXPECT_HEAD"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-increment-installed-report"
      - name: Verify production dependency graph is unchanged
        run: git diff --exit-code -- package.json bun.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installed-session-increments-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/loom-increment-installed-report/
          if-no-files-found: warn
          retention-days: 7
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request defaults to a synthetic merge SHA; acceptance targets the actual reviewed head.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - name: Pack and install exact Loom candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loom-stage3-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/loom-stage3-package" > "$RUNNER_TEMP/loom-stage3-package/pack.json"
          ARTIFACT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/loom-stage3-package/pack.json")
          npm install --prefix "$RUNNER_TEMP/loom-stage3-install" --no-audit --no-fund "$RUNNER_TEMP/loom-stage3-package/$ARTIFACT"
      - name: Install unmodified pinned OpenCode 2.3.0
        run: npm install --prefix "$RUNNER_TEMP/loom-stage3-host" --no-audit --no-fund @opencode/cli@2.3.0
      - name: Verify installed automatic learning through real native product path
        run: >-
          python3 tests/installed_learning_stage3.py
          --opencode "$RUNNER_TEMP/loom-stage3-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-stage3-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-stage3-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "${{ github.event.pull_request.head.sha }}"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-stage3-installed-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-stage3-mechanics-${{ github.sha }}
          path: ${{ runner.temp }}/loom-stage3-installed-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify installed Stage 4 preparation without Evaluator dispatch
        run: >-
          python3 tests/installed_learning_stage4.py
          --opencode "$RUNNER_TEMP/loom-stage3-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-stage3-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-stage3-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "${{ github.event.pull_request.head.sha }}"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-stage4-installed-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-stage4-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/loom-stage4-installed-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify restricted execution consumer with native local provider
        run: >-
          python3 tests/installed_evaluator_execution.py
          --opencode "$RUNNER_TEMP/loom-stage3-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-stage3-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-stage3-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "${{ github.event.pull_request.head.sha }}"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-execution-installed-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-restricted-execution-${{ github.sha }}
          path: ${{ runner.temp }}/loom-execution-installed-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify retrospective execution and native recipient retrieval
        run: >-
          python3 tests/installed_evaluator_execution.py
          --preparation-source retrospective
          --opencode "$RUNNER_TEMP/loom-stage3-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-stage3-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-stage3-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "${{ github.event.pull_request.head.sha }}"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-retrospective-execution-installed-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-retrospective-execution-${{ github.sha }}
          path: ${{ runner.temp }}/loom-retrospective-execution-installed-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify durable Evaluator publication through the controlled native lifecycle
        run: >-
          python3 tests/installed_evaluator_interpretations.py
          --opencode "$RUNNER_TEMP/loom-stage3-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-stage3-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-stage3-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "${{ github.event.pull_request.head.sha }}"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-interpretations-installed-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-evaluator-interpretations-${{ github.sha }}
          path: ${{ runner.temp }}/loom-interpretations-installed-report/
          if-no-files-found: warn
          retention-days: 7
