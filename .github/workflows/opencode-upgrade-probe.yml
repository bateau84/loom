name: OpenCode 2.0.29 upgrade probe
on:
  pull_request:
    paths: ['.github/workflows/opencode-upgrade-probe.yml']
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.pull_request.number == 180 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Upload generated Git blobs only; never update a branch or commit.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact candidate without changing the branch
        id: resolve
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade-report"
          npm view @opencode/plugin@2.0.29 version dist --json > "$RUNNER_TEMP/upgrade-report/plugin-package.json"
          npm view @opencode/cli@2.0.29 version dist --json > "$RUNNER_TEMP/upgrade-report/cli-package.json"
          npm view @opencode/cli dist-tags --json > "$RUNNER_TEMP/upgrade-report/cli-dist-tags.json"
          python3 - <<'PY'
          from pathlib import Path
          files = ['package.json', '.github/workflows/ci.yml', '.github/workflows/installed-host.yml', 'tests/tool-search-codemode.test.ts']
          for name in files:
              p = Path(name)
              text = p.read_text()
              p.write_text(text.replace('2.0.18', '2.0.29'))
          p = Path('.github/workflows/installed-host.yml')
          p.write_text(p.read_text().replace('- run: bun install\n', '- run: bun install --frozen-lockfile\n      - run: git diff --exit-code -- bun.lock\n'))
          PY
          bun install --ignore-scripts
          cp bun.lock "$RUNNER_TEMP/upgrade-report/bun.lock"
          cp package.json "$RUNNER_TEMP/upgrade-report/package.json"
          bun install --frozen-lockfile --ignore-scripts
          cmp bun.lock "$RUNNER_TEMP/upgrade-report/bun.lock"
          git diff --stat > "$RUNNER_TEMP/upgrade-report/change-stat.txt"
          git diff > "$RUNNER_TEMP/upgrade-report/candidate.patch"
      - name: Snapshot relevant pinned upstream source for comparison
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import os, urllib.request, json, difflib, hashlib
          root = Path(os.environ['RUNNER_TEMP']) / 'upgrade-report' / 'upstream'
          paths = ['packages/plugin/src/promise/session.ts', 'packages/plugin/src/promise/tool.ts', 'packages/plugin/src/promise/adapter.ts', 'packages/plugin/src/source.bun.ts', 'packages/plugin/src/host.ts', 'packages/schema/src/tool.ts', 'packages/core/src/codemode/tool.ts', 'packages/schema/src/session-inbox.ts', 'packages/core/src/session/session.ts', 'packages/core/src/session/runner/llm.ts', 'packages/core/src/session/inbox.ts', 'packages/protocol/src/groups/session.ts', 'packages/core/src/session/model-request.ts', 'packages/core/src/session/instruction-entry.ts', 'packages/core/src/session/instruction-state.ts', 'packages/plugin/package.json', 'packages/cli/package.json']
          def fetch(item):
              version, path = item
              target = root / version / path
              target.parent.mkdir(parents=True, exist_ok=True)
              url = f'https://raw.githubusercontent.com/anomalyco/opencode/{version}/{path}'
              try:
                  data = urllib.request.urlopen(url, timeout=30).read()
                  target.write_bytes(data)
                  return {'version': version, 'path': path, 'sha256': hashlib.sha256(data).hexdigest()}
              except Exception as e:
                  return {'version': version, 'path': path, 'error': str(e)}
          with ThreadPoolExecutor(max_workers=4) as pool:
              manifest = list(pool.map(fetch, [(v,p) for v in ['v2.0.18', 'v2.0.29'] for p in paths]))
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          for path in paths:
              a, b = root / 'v2.0.18' / path, root / 'v2.0.29' / path
              if a.exists() and b.exists():
                  patch = ''.join(difflib.unified_diff(a.read_text().splitlines(True), b.read_text().splitlines(True), fromfile='v2.0.18/'+path, tofile='v2.0.29/'+path))
                  target = root / 'diffs' / (path + '.diff')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(patch)
          PY
      - name: Run candidate checks independently and retain exact results
        if: steps.resolve.outcome == 'success'
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/upgrade-report"
          status=0
          check() { "$@" > "$report/$1-$2.log" 2>&1; rc=$?; printf '%s\t%s\n' "$rc" "$*" | tee -a "$report/checks.tsv"; if [ "$rc" != 0 ]; then status=1; fi; }
          check bun run typecheck
          check bun run test:core
          check bun run test:native
          python3 -m unittest discover -s tests -p 'test_*.py' > "$report/python.log" 2>&1
          rc=$?; printf '%s\tPython tests\n' "$rc" >> "$report/checks.tsv"; [ "$rc" = 0 ] || status=1
          npm install --prefix "$RUNNER_TEMP/loom-tool-search" --ignore-scripts --no-audit --no-fund @opencode/codemode@2.0.29 > "$report/search-install.log" 2>&1
          rc=$?; printf '%s\tSearch install\n' "$rc" >> "$report/checks.tsv"; [ "$rc" = 0 ] || status=1
          LOOM_CODEMODE_ROOT="$RUNNER_TEMP/loom-tool-search" bun test tests/tool-search-codemode.test.ts > "$report/search.log" 2>&1
          rc=$?; printf '%s\tSearch tests\n' "$rc" >> "$report/checks.tsv"; [ "$rc" = 0 ] || status=1
          npm install --prefix "$RUNNER_TEMP/loom-opencode-host" --no-audit --no-fund @opencode/cli@2.0.29 > "$report/host-install.log" 2>&1
          rc=$?; printf '%s\tHost install\n' "$rc" >> "$report/checks.tsv"; [ "$rc" = 0 ] || status=1
          python3 tests/installed_host_smoke.py --opencode "$RUNNER_TEMP/loom-opencode-host/node_modules/.bin/opencode" --expect-version 2.0.29 --report-directory "$report/host" > "$report/host.log" 2>&1
          rc=$?; printf '%s\tInstalled host boot\n' "$rc" >> "$report/checks.tsv"; [ "$rc" = 0 ] || status=1
          exit "$status"
      - name: Export generated blobs without changing any ref
        if: always() && steps.resolve.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, urllib.request, json, hashlib
          report = Path(os.environ['RUNNER_TEMP']) / 'upgrade-report'
          paths = ['package.json', 'bun.lock', '.github/workflows/ci.yml', '.github/workflows/installed-host.yml', 'tests/tool-search-codemode.test.ts']
          blobs = []
          for path in paths:
              data = Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/bateau84/loom/git/blobs', data=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              result = json.load(urllib.request.urlopen(request, timeout=30))
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert result['sha'] == expected
              blobs.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          (report / 'generated-blobs.json').write_text(json.dumps(blobs, indent=2))
          print(json.dumps(blobs, indent=2))
          PY
      - name: Retain source and focused test runtime for local inspection
        if: always()
        shell: bash
        run: |
          tar --exclude='./.git' --exclude='./node_modules' -czf "$RUNNER_TEMP/upgrade-report/candidate-source.tar.gz" .
          if [ -d node_modules/js-yaml ]; then tar -czf "$RUNNER_TEMP/upgrade-report/parser-deps.tar.gz" node_modules/js-yaml node_modules/argparse; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-2029-upgrade-probe
          path: ${{ runner.temp }}/upgrade-report/
          if-no-files-found: error
          retention-days: 7
