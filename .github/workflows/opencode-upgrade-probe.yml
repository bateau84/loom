name: OpenCode 2.0.29 upgrade probe
on:
  pull_request:
    paths: ['.github/workflows/opencode-upgrade-probe.yml']
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.pull_request.number == 180 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Create generated blobs only; never update commits or refs.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact upgrade and bounded integration additions
        id: prepare
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade-report"
          npm view @opencode/cli dist-tags --json > "$RUNNER_TEMP/upgrade-report/cli-dist-tags.json"
          npm view @opencode/plugin@2.0.29 version dist --json > "$RUNNER_TEMP/upgrade-report/plugin-package.json"
          python3 - <<'PY'
          from pathlib import Path
          for name in ['package.json', '.github/workflows/ci.yml', '.github/workflows/installed-host.yml', 'tests/tool-search-codemode.test.ts']:
              p = Path(name)
              p.write_text(p.read_text().replace('2.0.18', '2.0.29'))
          p = Path('.github/workflows/installed-host.yml')
          p.write_text(p.read_text().replace('- run: bun install\n', '- run: bun install --frozen-lockfile\n      - run: git diff --exit-code -- bun.lock\n'))
          PY
          git apply --recount --check .github/opencode-upgrade-core.patch
          git apply --recount .github/opencode-upgrade-core.patch
          python3 .github/opencode-upgrade-details.py
          bun install --ignore-scripts
          cp bun.lock "$RUNNER_TEMP/upgrade-report/bun.lock"
          bun install --frozen-lockfile --ignore-scripts
          cmp bun.lock "$RUNNER_TEMP/upgrade-report/bun.lock"
          git diff --check
          git diff --stat > "$RUNNER_TEMP/upgrade-report/change-stat.txt"
          git diff > "$RUNNER_TEMP/upgrade-report/candidate.patch"
      - name: Check the candidate without model requests
        if: steps.prepare.outcome == 'success'
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/upgrade-report"
          status=0
          check() { label="$1"; shift; "$@" > "$report/$label.log" 2>&1; rc=$?; printf '%s\t%s\n' "$rc" "$label: $*" | tee -a "$report/checks.tsv"; tail -n 12 "$report/$label.log"; if [ "$rc" != 0 ]; then status=1; fi; }
          check typecheck bun run typecheck
          check core bun run test:core
          check native bun run test:native
          check python python3 -m unittest discover -s tests -p 'test_*.py'
          check counterchecks python3 tools/check-review-regressions.py --report-directory "$report/counterchecks"
          check search-install npm install --prefix "$RUNNER_TEMP/loom-tool-search" --ignore-scripts --no-audit --no-fund @opencode/codemode@2.0.29
          check search env LOOM_CODEMODE_ROOT="$RUNNER_TEMP/loom-tool-search" bun test tests/tool-search-codemode.test.ts
          check host-install npm install --prefix "$RUNNER_TEMP/loom-opencode-host" --no-audit --no-fund @opencode/cli@2.0.29
          check host python3 tests/installed_host_smoke.py --opencode "$RUNNER_TEMP/loom-opencode-host/node_modules/.bin/opencode" --expect-version 2.0.29 --report-directory "$report/host"
          exit "$status"
      - name: Export reviewed candidate blobs without changing any ref
        if: always() && steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, urllib.request, json, hashlib
          paths = ['package.json', 'bun.lock', '.github/workflows/ci.yml', '.github/workflows/installed-host.yml', 'README.md', 'docs/installed-host-validation.md', 'docs/opencode-2.0.29.md', 'docs/tool-discovery.md', 'src/tool-help.ts', 'tests/installed_host_smoke.py', 'tests/package-entry.test.ts', 'tests/test_installed_host_smoke.py', 'tests/tool-help-native.test.ts', 'tests/tool-search-codemode.test.ts']
          report = Path(os.environ['RUNNER_TEMP']) / 'upgrade-report'
          blobs = []
          for path in paths:
              data = Path(path).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/bateau84/loom/git/blobs', data=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              result = json.load(urllib.request.urlopen(request, timeout=30))
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert result['sha'] == expected
              blobs.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
          (report / 'generated-blobs.json').write_text(json.dumps(blobs, indent=2))
          print(json.dumps(blobs, indent=2))
          PY
      - name: Retain source for exact local comparison
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade-report"
          tar --exclude='./.git' --exclude='./node_modules' -czf "$RUNNER_TEMP/upgrade-report/candidate-source.tar.gz" .
          if [ -d node_modules/js-yaml ]; then tar -czf "$RUNNER_TEMP/upgrade-report/parser-deps.tar.gz" node_modules/js-yaml node_modules/argparse; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-2029-upgrade-probe
          path: ${{ runner.temp }}/upgrade-report/
          if-no-files-found: error
          retention-days: 7
