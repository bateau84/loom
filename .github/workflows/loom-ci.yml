name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Smoke test pinned eval-runner action/runtime pair
        uses: bateau84/opencode-eval-runner@a22f09a0494014a87abf3292e4815fe42b85f035
        with:
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:5cc9571629bfba84636d5205e04ed6a0b6cbd77369061a25ccee5377631570ae
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:ada713db25e57a76d1e35a9bbd2c507bb2f3300c128ea44efc8b3d74d80dcdc9
          prepare-opencode: true
          prepare-copilot: true
          command: |
            opencode-eval-runner --help
            docker image inspect "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" >/dev/null
            docker image inspect "$OPENCODE_EVAL_RUNNER_COPILOT_IMAGE" >/dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
