name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Smoke test pinned eval-runner action/runtime pair
        uses: bateau84/opencode-eval-runner@a7cef2906b176ed661a3a858f16cea6ca9bc2714
        with:
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:9a66a6e147f198be17bb418c77a3cd191fcbd7cd20ead88038cee3da9d752b05
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:9d3390aac1ca3a41443538fd561007b232338b7ddd0960834c7d6453e3e3ce08
          prepare-opencode: true
          prepare-copilot: true
          command: |
            opencode-eval-runner --help
            docker image inspect "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" >/dev/null
            docker image inspect "$OPENCODE_EVAL_RUNNER_COPILOT_IMAGE" >/dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Verify real Loom tools in pinned eval runner
        run: |
          set -euo pipefail
          image="ghcr.io/bateau84/opencode-eval-runner@sha256:9a66a6e147f198be17bb418c77a3cd191fcbd7cd20ead88038cee3da9d752b05"
          docker run --rm \
            --workdir /workspace \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD:/seed/opencode-config:ro" \
            --entrypoint python3 \
            "$image" - <<'PY'
          import json
          import subprocess
          import sys

          sys.path.insert(0, "/opt/opencode-eval-runner")
          from container.invoke import prepare_opencode_env

          env = prepare_opencode_env()
          proc = subprocess.run(
              ["opencode", "api", "--standalone", "GET", "/experimental/tool/ids"],
              cwd="/workspace",
              env=env,
              capture_output=True,
              text=True,
              timeout=30,
              check=False,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  f"tool registry failed ({proc.returncode}): "
                  f"stdout={proc.stdout!r} stderr={proc.stderr!r}"
              )
          if not proc.stdout.strip():
              raise SystemExit(
                  "tool registry returned empty stdout; "
                  f"stderr={proc.stderr!r}"
              )
          payload = json.loads(proc.stdout)
          tools = payload.get("data") if isinstance(payload, dict) and "data" in payload else payload
          if not isinstance(tools, list):
              raise SystemExit(f"unexpected tool registry payload: {payload!r}")
          required = {"loom_start", "loom_route"}
          missing = sorted(required - set(tools))
          if missing:
              loom = sorted(tool for tool in tools if isinstance(tool, str) and tool.startswith("loom_"))
              raise SystemExit(f"missing Loom tools {missing}; observed Loom tools={loom}")
          print("PASS real Loom plugin registration:", ", ".join(sorted(required)))
          PY

      - name: Install OpenCode V2 for zero-inference host integration
        run: npm install --global @opencode/cli@2.0.12
      - run: bun run integration:opencode
      - run: bun run test
      - run: bun run typecheck
      - name: Install Playwright Chromium for dashboard Designer validation
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run dashboard browser Designer validation
        run: npx playwright test dashboard/e2e.spec.mjs --browser=chromium --workers=1
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
