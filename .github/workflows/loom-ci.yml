name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Smoke test pinned eval-runner action/runtime pair
        uses: bateau84/opencode-eval-runner@c4d583478c246f34e4373b1a77b52484620448cd
        with:
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:4dd282f5a5605b90e3bf87e290dcfe7407d7f45ebd58f7307151d77ae41ca180
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:6aa4a6104761f10036d8a45f98cc2764d72cb0dc6d67722bd4cfb35187720e74
          prepare-opencode: true
          prepare-copilot: true
          command: |
            opencode-eval-runner --help
            docker image inspect "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" >/dev/null
            docker run --rm --entrypoint opencode "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" --version | grep -F "2.0.15"
            docker image inspect "$OPENCODE_EVAL_RUNNER_COPILOT_IMAGE" >/dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Verify real Loom plugin activation and rejection in pinned eval runner
        run: |
          set -euo pipefail
          image="ghcr.io/bateau84/opencode-eval-runner@sha256:4dd282f5a5605b90e3bf87e290dcfe7407d7f45ebd58f7307151d77ae41ca180"
          workspace="$RUNNER_TEMP/loom-runtime-workspace"
          runtime="$RUNNER_TEMP/loom-preflight-runtime"
          rm -rf "$workspace" "$runtime"
          mkdir -p "$workspace/.opencode/agents" "$runtime"
          cp agents/general.md "$workspace/.opencode/agents/general.md"
          printf '%s\n' '{"$schema":"https://opencode.ai/config.json","default_agent":"general"}' > "$workspace/opencode.json"

          # Execute a mounted file: python3 - with a heredoc silently did no
          # work when Docker stdin was closed. Require emitted proof as well
          # as a successful exit; the script checks activation and rejection.
          # Both writable roots belong to the invoking non-root UID, rather
          # than assuming the image and hosted runner use the same identity.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace \
            --volume "$workspace:/workspace:rw" \
            --volume "$runtime:/tmp/runtime:rw" \
            --volume "$PWD/node_modules:/workspace/node_modules:ro" \
            --volume "$PWD:/seed/opencode-config:ro" \
            --entrypoint python3 \
            "$image" /seed/opencode-config/scripts/verify_runner_plugin.py \
            | tee "$RUNNER_TEMP/loom-plugin-preflight.log"
          grep -Fxq 'PASS real Loom plugin activation' "$RUNNER_TEMP/loom-plugin-preflight.log"
          grep -Fxq 'PASS missing plugin rejected' "$RUNNER_TEMP/loom-plugin-preflight.log"

      - name: Install OpenCode V2 for zero-inference host integration
        run: |
          npm install --global @opencode/cli@2.0.15
          opencode --version | grep -F "2.0.15"

      - name: Verify eval DB sanitizer against a fresh OpenCode 2.0.15 database
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/opencode-fresh-db"
          rm -rf "$root"
          mkdir -p "$root/home" "$root/config" "$root/data" "$root/cache" "$root/state"
          db="$root/opencode.db"

          HOME="$root/home" \
          XDG_CONFIG_HOME="$root/config" \
          XDG_DATA_HOME="$root/data" \
          XDG_CACHE_HOME="$root/cache" \
          XDG_STATE_HOME="$root/state" \
          OPENCODE_DB="$db" \
          OPENCODE_DISABLE_AUTOUPDATE=1 \
            opencode debug agents >/dev/null

          test -s "$db"
          OPENCODE_FRESH_DB="$db" python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sqlite3
          import tempfile

          module_path = Path("scripts/run-evals.py").resolve()
          spec = importlib.util.spec_from_file_location("loom_run_evals_fresh_db", module_path)
          assert spec and spec.loader
          run_evals = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(run_evals)

          source = Path(os.environ["OPENCODE_FRESH_DB"])
          with sqlite3.connect(source) as db:
              source_tables = {
                  row[0]
                  for row in db.execute(
                      "SELECT name FROM sqlite_master WHERE type = 'table'"
                  )
              }
          assert "credential" in source_tables, source_tables
          assert "session_v2" in source_tables, source_tables

          with tempfile.TemporaryDirectory() as tmp:
              destination = Path(tmp) / "sanitized.db"
              run_evals.sanitize_database_seed(source, destination)
              with sqlite3.connect(destination) as db:
                  tables = {
                      row[0]
                      for row in db.execute(
                          "SELECT name FROM sqlite_master WHERE type = 'table'"
                      )
                  }
                  credentials = db.execute("SELECT COUNT(*) FROM credential").fetchone()[0]
              assert "credential" in tables, tables
              assert "session_v2" in tables, tables
              assert credentials == 0, credentials
          PY

      - run: bun run integration:opencode
      - run: bun run test
      - run: bun run typecheck
      - name: Install Playwright Chromium for dashboard Designer validation
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser Designer validation
        id: dashboard-browser
        run: npx playwright test dashboard/e2e.spec.mjs dashboard/status-view.e2e.spec.ts dashboard/review-regressions.e2e.spec.mjs --browser=chromium --workers=1
      - name: Retain synthetic dashboard review evidence
        if: ${{ !cancelled() && (steps.dashboard-browser.outcome == 'success' || steps.dashboard-browser.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-review-evidence
          path: |
            test-results/**/*.png
            test-results/**/generated-ui.html
            test-results/**/fleet.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
