name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Smoke test pinned eval-runner action/runtime pair
        uses: bateau84/opencode-eval-runner@e2022f1075e34fe7be2a33eae3c9460f3f5c7263
        with:
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:3e5f95ce54fee127230c5bf84a7f09124a2236dfca544269e6547c8f79e8ad5d
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:8def0aa1885b0e60b36a1434c2725667b1b9555def31426f08dd7e2a87dc02c5
          prepare-opencode: true
          prepare-copilot: true
          command: |
            opencode-eval-runner --help
            docker image inspect "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" >/dev/null
            docker image inspect "$OPENCODE_EVAL_RUNNER_COPILOT_IMAGE" >/dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Verify real Loom plugin activation in pinned eval runner
        timeout-minutes: 2
        run: |
          set -euo pipefail
          image="ghcr.io/bateau84/opencode-eval-runner@sha256:3e5f95ce54fee127230c5bf84a7f09124a2236dfca544269e6547c8f79e8ad5d"
          docker run --rm -i \
            --workdir /workspace \
            --tmpfs /workspace:rw,mode=1777 \
            --volume "$PWD/node_modules:/workspace/node_modules:ro" \
            --volume "$PWD:/seed/opencode-config:ro" \
            --entrypoint python3 \
            "$image" - <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          # Create fixture files as the container's unprivileged user, not the
          # host runner UID. The checkout and dependency mounts remain read-only.
          agents = Path("/workspace/.opencode/agents")
          agents.mkdir(parents=True)
          shutil.copyfile("/seed/opencode-config/agents/general.md", agents / "general.md")
          Path("/workspace/opencode.json").write_text(json.dumps({
              "$schema": "https://opencode.ai/config.json",
              "default_agent": "general",
          }), encoding="utf-8")
          sys.path.insert(0, "/opt/opencode-eval-runner")
          from container.invoke import prepare_opencode_env, verify_expected_plugin

          env = prepare_opencode_env()
          result = verify_expected_plugin(
              env,
              "general",
              "openai/preflight-no-inference",
              "loom",
              30,
          )
          assert result["plugin"]["id"] == "loom", result
          assert result["plugin"]["state"]["status"] == "active", result
          assert result["verification"] == "plugin-entrypoint+activation-barrier+plugin-inventory", result
          print("PASS real Loom plugin activation")
          PY

      - name: Install OpenCode V2 for zero-inference host integration
        run: npm install --global @opencode/cli@2.0.12
      - run: bun run integration:opencode
      - run: bun run test
      - run: bun run typecheck
      - name: Install Playwright Chromium for dashboard Designer validation
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser Designer validation
        id: dashboard-browser
        run: npx playwright test dashboard/e2e.spec.mjs dashboard/status-view.e2e.spec.ts dashboard/review-regressions.e2e.spec.mjs --browser=chromium --workers=1
      - name: Retain synthetic dashboard review evidence
        if: ${{ !cancelled() && (steps.dashboard-browser.outcome == 'success' || steps.dashboard-browser.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-review-evidence
          path: |
            test-results/**/*.png
            test-results/**/generated-ui.html
            test-results/**/fleet.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
