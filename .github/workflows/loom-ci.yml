name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run test
      - run: bun run typecheck
