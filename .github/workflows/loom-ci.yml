name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test eval-runner action
        uses: bateau84/opencode-eval-runner@bd02908d134ccec81d4497604b7b115606cf9b45
        with:
          prepare-opencode: false
          prepare-copilot: false
          command: opencode-eval-runner --help
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run test
      - run: bun run typecheck
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
