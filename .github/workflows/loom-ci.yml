name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Smoke test pinned eval-runner action/runtime pair
        uses: bateau84/opencode-eval-runner@8e1a8439fd8b15343abcf69c50203c96847f1c2e
        with:
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:eece79be0987d41c96cfbc43a4a0792987af383f2edec4e6651f43a954f1874f
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:51d484e8b12541eeceef11c0818e26c97d77cc7d81a29b0c720b840d0226968b
          prepare-opencode: true
          prepare-copilot: true
          command: |
            opencode-eval-runner --help
            docker image inspect "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" >/dev/null
            docker image inspect "$OPENCODE_EVAL_RUNNER_COPILOT_IMAGE" >/dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install OpenCode V2 for zero-inference host integration
        run: npm install --global @opencode/cli@2.0.12
      - run: bun run integration:opencode
      - run: bun run test
      - run: bun run typecheck
      - name: Install Playwright Chromium for dashboard Designer validation
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser Designer validation
        run: npx playwright test dashboard/e2e.spec.mjs dashboard/status-view.e2e.spec.ts --browser=chromium --workers=1
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
