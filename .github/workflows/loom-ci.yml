name: Loom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Smoke test pinned eval-runner action/runtime pair
        uses: bateau84/opencode-eval-runner@2c9e19f96ddaf4f996042263a92f072a32237ec8
        with:
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:9dad96313bb15efaa4164a976bfd244ad804cac851b33543b44dcfb4e1cafc22
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:4574ac32b32f42f5f1bfeefe091a56edca14b40a95570544e324dad87c068215
          prepare-opencode: true
          prepare-copilot: true
          command: |
            opencode-eval-runner --help
            docker image inspect "$OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE" >/dev/null
            docker image inspect "$OPENCODE_EVAL_RUNNER_COPILOT_IMAGE" >/dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Verify real Loom plugin activation in pinned eval runner
        run: |
          set -euo pipefail
          image="ghcr.io/bateau84/opencode-eval-runner@sha256:9dad96313bb15efaa4164a976bfd244ad804cac851b33543b44dcfb4e1cafc22"
          workspace="$RUNNER_TEMP/loom-runtime-workspace"
          rm -rf "$workspace"
          mkdir -p "$workspace/.opencode/agents"
          cp agents/general.md "$workspace/.opencode/agents/general.md"
          printf '%s\n' '{"$schema":"https://opencode.ai/config.json","default_agent":"general"}' > "$workspace/opencode.json"

          docker run --rm \
            --workdir /workspace \
            --volume "$workspace:/workspace:rw" \
            --volume "$PWD/node_modules:/workspace/node_modules:ro" \
            --volume "$PWD:/seed/opencode-config:ro" \
            --entrypoint python3 \
            "$image" - <<'PY'
          import sys

          sys.path.insert(0, "/opt/opencode-eval-runner")
          from container.invoke import prepare_opencode_env, verify_expected_plugin

          env = prepare_opencode_env()
          result = verify_expected_plugin(
              env,
              "general",
              "openai/preflight-no-inference",
              "loom",
              30,
          )
          assert result["plugin"]["id"] == "loom", result
          assert result["plugin"]["state"]["status"] == "active", result
          assert result["verification"] == "plugin-entrypoint+activation-barrier+plugin-inventory", result
          print("PASS real Loom plugin activation")
          PY

      - name: Install OpenCode V2 for zero-inference host integration
        run: npm install --global @opencode/cli@2.0.12
      - run: bun run integration:opencode
      - run: bun run test
      - run: bun run typecheck
      - name: Install Playwright Chromium for dashboard Designer validation
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser Designer validation
        run: npx playwright test dashboard/e2e.spec.mjs dashboard/status-view.e2e.spec.ts --browser=chromium --workers=1
      - run: bun run eval:validate
      - run: bun run eval:harness-test
      - run: bun run skills:validate
      - run: python3 -m py_compile scripts/run-evals.py
      - run: python3 scripts/run-evals.py --list
