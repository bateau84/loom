# TEMPORARY: remove after committing the Bun-generated lockfile.
name: Generate OpenCode 2.2.0 dependency lock
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/opencode-2.2.0-host'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Generate exact lockfile using the pinned Bun
        run: bun install --lockfile-only --ignore-scripts
      - name: Emit lockfile contents for Git API commit
        run: |
          echo "LOOM_LOCK_BEGIN"
          base64 -w 1000 bun.lock
          echo "LOOM_LOCK_END"
