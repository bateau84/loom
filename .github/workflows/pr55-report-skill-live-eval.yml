name: PR55 Report Skill Live Eval

on:
  push:
    branches:
      - feat/ephemeral-report-governance

permissions:
  contents: read
  copilot-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVAL_MODEL: opencode-go/gpt-5.6-luna
      JUDGE_MODEL: opencode-go/gpt-5.6-luna
      TARGET_TRANSPORT: opencode
      JUDGE_TRANSPORT: opencode
      EVAL_CASES: SKILL-REPORT-KEEP-01,SKILL-REPORT-KEEP-02

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run eval:validate

      - name: Materialize optional OpenCode auth
        shell: bash
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_AUTH_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-auth"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            echo "OPENCODE_EVAL_RUNNER_AUTH=$RUNNER_TEMP/loom-opencode-auth/auth.json" >> "$GITHUB_ENV"
          fi

      - name: Materialize optional OpenCode model catalog
        shell: bash
        env:
          OPENCODE_MODELS_JSON: ${{ secrets.OPENCODE_MODELS_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_MODELS_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-models"
            printf '%s' "$OPENCODE_MODELS_JSON" > "$RUNNER_TEMP/loom-opencode-models/models.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-models/models.json"
            echo "OPENCODE_EVAL_RUNNER_MODELS=$RUNNER_TEMP/loom-opencode-models/models.json" >> "$GITHUB_ENV"
          fi

      - name: Run report retention live evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        uses: bateau84/opencode-eval-runner@a22f09a0494014a87abf3292e4815fe42b85f035
        with:
          engine: docker
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:5cc9571629bfba84636d5205e04ed6a0b6cbd77369061a25ccee5377631570ae
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:ada713db25e57a76d1e35a9bbd2c507bb2f3300c128ea44efc8b3d74d80dcdc9
          prepare-opencode: true
          prepare-copilot: false
          artifact-dir: .loom-evals
          command: |
            args=(
              python3 scripts/run-evals.py
              --engine docker
              --model "$EVAL_MODEL"
              --judge-model "$JUDGE_MODEL"
              --target-transport "$TARGET_TRANSPORT"
              --judge-transport "$JUDGE_TRANSPORT"
              --target-kind skill
              --cases "$EVAL_CASES"
            )
            if [[ -n "${OPENCODE_API_KEY:-}" ]]; then
              args+=(--env OPENCODE_API_KEY)
            fi
            "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr55-report-skill-live-evals
          path: .loom-evals/
          if-no-files-found: warn
          include-hidden-files: true
