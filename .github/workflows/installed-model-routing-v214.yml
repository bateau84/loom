name: Installed OpenCode 2.1.4 initial routing guard
on:
  pull_request:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Pack and install exact candidate plugin (SDK 2.1.1)
        run: |
          mkdir -p "$RUNNER_TEMP/loom-routing-artifact"
          npm pack --json --pack-destination "$RUNNER_TEMP/loom-routing-artifact" > "$RUNNER_TEMP/loom-routing-artifact/pack.json"
          ARTIFACT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/loom-routing-artifact/pack.json")
          npm install --prefix "$RUNNER_TEMP/loom-routing-install" --no-audit --no-fund "$RUNNER_TEMP/loom-routing-artifact/$ARTIFACT"
      - name: Install isolated unmodified OpenCode 2.1.4 CLI
        run: npm install --prefix "$RUNNER_TEMP/loom-routing-host" --no-audit --no-fund @opencode/cli@2.1.4
      - name: Actual native request negative control and routing-disabled control
        run: >-
          python3 tests/installed_model_routing.py
          --opencode "$RUNNER_TEMP/loom-routing-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-routing-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-routing-artifact" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-routing-report"
          --repository "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-model-routing-v214-${{ github.sha }}
          path: ${{ runner.temp }}/loom-routing-report/
          if-no-files-found: warn
          retention-days: 7
