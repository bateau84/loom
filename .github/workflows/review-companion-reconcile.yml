name: Temporary review-companion reconciliation
on:
  push:
    branches: [feat/role-scoped-review-companions-20261022]
    paths: [.github/workflows/review-companion-reconcile.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'bateau84/loom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/role-scoped-review-companions-20261022
          fetch-depth: 2
      - name: Apply bounded integration corrections
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 5ffa2656385b820a4a51da4987807e8bbfa825e2
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          changed = set()
          def replace(path, old, new, count=1):
              p = Path(path)
              source = p.read_text()
              actual = source.count(old)
              if actual != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences of {old!r}, found {actual}')
              p.write_text(source.replace(old, new))
              changed.add(path)
          for path, count in {
              'tests/review-findings-native.test.ts': 3,
              'tests/retired-protocol-native.test.ts': 1,
              'tests/collaboration-native.test.ts': 3,
              'tests/concerns-native.test.ts': 1,
              'tests/full-thread-native.test.ts': 1,
          }.items():
              replace(path, 'expect(f.tools.size).toBe(5)', 'expect(f.tools.size).toBe(7)', count)
          replace('tests/native.test.ts', 'expect(tools.sort()).toEqual(["action", "agents", "context", "plan", "record"])', 'expect(tools.sort()).toEqual(["action", "agents", "assessment", "context", "plan", "qa", "record"])')
          replace('tests/native.test.ts', 'expect(registrations.sort()).toEqual(["skill", "tool"])', 'expect(registrations.sort()).toEqual(["skill", "tool", "tool"])')
          replace('tests/native.test.ts', 'startup still registers five tools', 'startup still registers seven tools')
          # Preserve the core's immediate shutdown cancellation, before awaiting new registration cleanup.
          replace('server.ts', 'try { await companions?.() }\n        finally {\n          try { await cleanup?.() }', 'try { await cleanup?.() }\n        finally {\n          try { await companions?.() }')
          guide = 'src/skills/loom/SKILL.md'
          replace(guide, 'Use for Loom coordination/resumption. Load engineering skills separately.\n\n', '')
          replace(guide, '| `loom_action` | Goals and read-only Session inventory. Creation selects; state labels do not stop execution or certify success. |', '| `loom_action` | Goals and Session inventory; state labels are not execution controls or proof. |')
          replace(guide, 'Tool search supplies schemas/help. Tools return JSON with `result` and optional', 'Tool search supplies help. Tools return JSON with `result` and optional')
          assert len(Path(guide).read_text()) <= 12000
          assert Path(guide).read_text().count('```json\n') == 7
          # Correct current user guidance without rewriting unrelated historical evidence.
          readme = 'README.md'
          replace(readme, '- Five tools: `loom_agents`, `loom_action`, `loom_plan`, `loom_context`, `loom_record`.', '- Seven tools: `loom_agents`, `loom_action`, `loom_plan`, `loom_context`, `loom_record`,\n  `loom_assessment`, and `loom_qa`.')
          replace(readme, '`enabled: false` disables Loom guidance for that agent.', '`enabled: false` disables Loom guidance and companion-loader access for that agent.')
          replace(readme, 'agents, add a sixth tool or change role/context injection.', 'agents or eagerly inject the guide. Companion loaders are separate tools with role checks.')
          replace(readme, 'five-tool guide and Research', 'tool guide and Research')
          replace(readme, 'Load external skills and their `ASSESSMENT.md`/`QA.md` companions with native tools.\nLoom does not require a special companion-loader ceremony. These are stored\nreview results, not an automatic guarantee of reviewer independence.', 'Choose relevant skills independently. Use `loom_assessment` to load `ASSESSMENT.md`\nand `loom_qa` to load `QA.md` from the installed skill. The enabled caller needs\nthe corresponding existing `assessment` or `qa` role in `.loom.yaml`; native\nskill permissions still apply. No Action, Plan, prior skill receipt or mandatory\nreview stage is required. Missing companions are reported, never substituted.\nSee [Assessment and QA companions](docs/review-companions.md) for configuration,\nexamples and limits. Loading instructions and recording findings are separate;\nneither guarantees independent review.')
          tools = 'docs/tools.md'
          replace(tools, '# Five tools, optional structure', '# Seven tools, optional structure')
          row = '| `loom_record` | Concerns, results, claims, Assessment/QA, completion/reopen, questions/answers and history |'
          replace(tools, row, row + '\n| `loom_assessment` | Load an installed skill’s ASSESSMENT.md; requires the enabled caller’s assessment role |\n| `loom_qa` | Load an installed skill’s QA.md; requires the enabled caller’s qa role |')
          replace(tools, '## Recover or define work', '## Assessment and QA lenses\n\nCall either loader with `{"skill":"software-engineering"}` using an exact native\nskill ID. The existing `.loom.yaml` role mapping controls its use; agent names\nand Plan roles do not grant access. Native skill allow/ask/deny still applies.\nThe tools return full companion content, its path and hash, or an explicit\nmissing-companion result. They need no Action or Plan and do not record verdicts\nor dispatch work. See [companion configuration and limits](review-companions.md).\n\n## Recover or define work')
          assert Path(tools).read_text().count('```json\n') == 8
          index = 'docs/index.md'
          p = Path(index); s = p.read_text(); lines = s.splitlines(keepends=True)
          hits = [i for i, line in enumerate(lines) if '/docs/tools.md' in line]
          assert len(hits) == 1, hits
          i = hits[0]
          lines[i] = lines[i].replace('Five tools', 'Seven tools').replace('five tools', 'seven tools')
          lines.insert(i + 1, '- [Assessment and QA skill companions](/docs/review-companions.md): optional role-scoped loaders for installed review instructions.\n')
          p.write_text(''.join(lines)); changed.add(index)
          log = 'docs/log.md'
          replace(log, '## 2026-10-22\n', '## 2026-10-22\n\n**Creation**: `review-companions.md` documents restored `loom_assessment` and\n`loom_qa`, existing role checks, native skill permissions and explicit missing\ncompanions. These are read-only instructions, not a restored workflow engine.\n\n**Update**: README, tool reference, documentation index and bundled guide describe\nthe seven-tool interface while preserving handoff and independent-review guidance.\n')
          expected = {
              'tests/review-findings-native.test.ts', 'tests/retired-protocol-native.test.ts',
              'tests/collaboration-native.test.ts', 'tests/concerns-native.test.ts',
              'tests/full-thread-native.test.ts', 'tests/native.test.ts',
              'server.ts', guide, readme, tools, index, log,
          }
          assert changed == expected
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert actual == expected, actual
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
      - name: Publish corrections to this draft only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve shutdown semantics and reconcile seven-tool guidance'
          git push origin HEAD:feat/role-scoped-review-companions-20261022
