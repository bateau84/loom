name: PR87 Scope Live Evals

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  copilot-requests: write

jobs:
  scope-live-evals:
    if: github.event.pull_request.number == 87
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Validate corpus
        run: bun run eval:validate

      - name: Run focused scope/autonomy live evals
        uses: bateau84/opencode-eval-runner@c4d583478c246f34e4373b1a77b52484620448cd
        with:
          engine: docker
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:6aa4a6104761f10036d8a45f98cc2764d72cb0dc6d67722bd4cfb35187720e74
          prepare-opencode: false
          prepare-copilot: true
          artifact-dir: .loom-evals-pr87
          command: |
            python3 scripts/run-evals.py \
              --engine docker \
              --model gpt-4.1 \
              --judge-model gpt-4.1 \
              --target-transport github-copilot-cli \
              --judge-transport github-copilot-cli \
              --target-kind agent \
              --iterations 1 \
              --cases "PRO-AUTONOMY-WORKER-01,PRO-AUTONOMY-WORKER-SCOPE-HANDOFF-01,PRO-AUTONOMY-GENERAL-SCOPE-APPROVAL-01"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr87-scope-live-evals
          path: .loom-evals-pr87/
          if-no-files-found: warn
          include-hidden-files: true
