name: PR48 Live Skill Proof

on:
  push:
    branches:
      - feature/action-skill-evals

permissions:
  contents: read
  copilot-requests: write

jobs:
  skill-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install

      - name: Prove skill loading through real OpenCode
        uses: bateau84/opencode-eval-runner@bd02908d134ccec81d4497604b7b115606cf9b45
        with:
          engine: docker
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:279af644d0d05a17fecc0a277dc9648e0d03fb7d3c74a1f0fa05303c8c552f83
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:fbc8f007ff339c6a6d47d4b1113874084cbf0eb7e62c7bb69bf9ccd70cdae799
          artifact-dir: .loom-evals
          command: |
            python3 - <<'PY'
            import importlib.util
            import json
            import os
            import shutil
            from concurrent.futures import ThreadPoolExecutor, as_completed
            from pathlib import Path

            root = Path.cwd()
            spec = importlib.util.spec_from_file_location("loom_run_evals", root / "scripts" / "run-evals.py")
            assert spec and spec.loader
            mod = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(mod)

            cases = [
                case for case in json.loads((root / "evals" / "skills.json").read_text())["cases"]
                if case["id"] == "SKILL-GO-CONC-01"
            ]
            image = os.environ["OPENCODE_EVAL_RUNNER_OPENCODE_IMAGE"]

            def prove(case):
                temp, project, _ = mod.setup_projects(case)
                try:
                    result = mod.invoke_container(
                        engine="docker",
                        image=image,
                        transport="opencode",
                        model="opencode/big-pickle",
                        agent=case["agent"],
                        prompt=mod.target_prompt(case),
                        system="",
                        project=project,
                        auth=None,
                        config=None,
                        models_catalog=None,
                        database_seed=None,
                        config_root=root,
                        expected_plugin="loom",
                        timeout=480,
                        container_timeout=540,
                        mount_node_modules=True,
                        extra_envs=[],
                        skill=case["skill"],
                    )
                    error = mod.transport_error(result)
                    if error:
                        raise RuntimeError(f"{case['id']}: {error}")
                    actions = mod.normalized_target_actions(result)
                    failures = mod.deterministic_failures(
                        case,
                        list(result.get("tools") or []),
                        actions,
                        list(result.get("skills_loaded") or []),
                    )
                    if failures:
                        raise RuntimeError(f"{case['id']}: " + "; ".join(failures))
                    return case["id"], result["skills_loaded"]
                finally:
                    shutil.rmtree(temp, ignore_errors=True)

            with ThreadPoolExecutor(max_workers=1) as pool:
                futures = [pool.submit(prove, case) for case in cases]
                for future in as_completed(futures):
                    case_id, loaded = future.result()
                    print(f"{case_id}: target integration PASS; skills_loaded={loaded}")
            PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr48-live-skill-proof
          path: .loom-evals/
          if-no-files-found: warn
