name: Loom Live Behavioral Evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: Target model. OpenCode uses provider/model; Copilot CLI uses its model name.
        required: true
        type: string
      judge_model:
        description: Optional judge model. Required when judge transport differs from target transport.
        required: false
        type: string
      target_transport:
        description: Target model transport. Skill-owned suites support OpenCode or GitHub Copilot; native skill-routing cases require OpenCode.
        required: true
        default: opencode
        type: choice
        options:
          - opencode
          - github-copilot-cli
      judge_transport:
        description: Judge model transport
        required: true
        default: opencode
        type: choice
        options:
          - opencode
          - github-copilot-cli
      target_kind:
        description: Limit the run to agent cases, skill cases, or both
        required: true
        default: all
        type: choice
        options:
          - all
          - agent
          - skill
      target:
        description: Optional comma-separated agent or skill names. Skill names discover every *.json under skills/<skill>/evals/.
        required: false
        default: ""
        type: string
      cases:
        description: Optional comma-separated case IDs. Combines with target_kind/target when supplied.
        required: false
        default: ""
        type: string
      all:
        description: Run the full behavioral corpus
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  copilot-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVAL_MODEL: ${{ inputs.model }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      TARGET_TRANSPORT: ${{ inputs.target_transport }}
      JUDGE_TRANSPORT: ${{ inputs.judge_transport }}
      EVAL_TARGET_KIND: ${{ inputs.target_kind }}
      EVAL_TARGET: ${{ inputs.target }}
      EVAL_CASES: ${{ inputs.cases }}
      EVAL_ALL: ${{ inputs.all }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Validate corpus
        run: bun run eval:validate

      - name: Materialize optional OpenCode auth
        shell: bash
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_AUTH_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-auth"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            echo "OPENCODE_EVAL_RUNNER_AUTH=$RUNNER_TEMP/loom-opencode-auth/auth.json" >> "$GITHUB_ENV"
          fi

      - name: Materialize optional OpenCode model catalog
        shell: bash
        env:
          OPENCODE_MODELS_JSON: ${{ secrets.OPENCODE_MODELS_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_MODELS_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-models"
            printf '%s' "$OPENCODE_MODELS_JSON" > "$RUNNER_TEMP/loom-opencode-models/models.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-models/models.json"
            echo "OPENCODE_EVAL_RUNNER_MODELS=$RUNNER_TEMP/loom-opencode-models/models.json" >> "$GITHUB_ENV"
          fi

      - name: Run isolated live evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        uses: bateau84/opencode-eval-runner@c5149331b0feee2e3d25b9b8fd4128764423e4f8
        with:
          engine: docker
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:e442ea2fe41a48a489ff832815ca7b3752ebdd4f667992e984c91a47847440e4
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:4574ac32b32f42f5f1bfeefe091a56edca14b40a95570544e324dad87c068215
          prepare-opencode: ${{ inputs.target_transport == 'opencode' || inputs.judge_transport == 'opencode' }}
          prepare-copilot: ${{ inputs.target_transport == 'github-copilot-cli' || inputs.judge_transport == 'github-copilot-cli' }}
          artifact-dir: .loom-evals
          command: |
            args=(
              python3 scripts/run-evals.py
              --engine docker
              --model "$EVAL_MODEL"
              --target-transport "$TARGET_TRANSPORT"
              --judge-transport "$JUDGE_TRANSPORT"
              --target-kind "$EVAL_TARGET_KIND"
            )
            if [[ -n "$EVAL_TARGET" ]]; then
              args+=(--target "$EVAL_TARGET")
            fi
            if [[ -n "$JUDGE_MODEL" ]]; then
              args+=(--judge-model "$JUDGE_MODEL")
            fi
            if [[ -n "${OPENCODE_API_KEY:-}" ]]; then
              args+=(--env OPENCODE_API_KEY)
            fi
            if [[ "$EVAL_ALL" == "true" ]]; then
              args+=(--all)
            elif [[ -n "$EVAL_CASES" ]]; then
              args+=(--cases "$EVAL_CASES")
            fi
            "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loom-live-evals
          path: .loom-evals/
          if-no-files-found: warn
          include-hidden-files: true
