name: Loom Live Behavioral Evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: Target model. OpenCode uses provider/model; Copilot CLI uses its model name.
        required: true
        type: string
      judge_model:
        description: Optional judge model. Required when judge transport differs from target transport.
        required: false
        type: string
      target_transport:
        description: Target model transport
        required: true
        default: opencode
        type: choice
        options:
          - opencode
          - github-copilot-cli
      judge_transport:
        description: Judge model transport
        required: true
        default: opencode
        type: choice
        options:
          - opencode
          - github-copilot-cli
      cases:
        description: Comma-separated case IDs
        required: false
        default: INTENT-01,REVIEW-01,WORK-01,CRITIC-01
        type: string
      all:
        description: Run the full behavioral corpus
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  copilot-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.model }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      TARGET_TRANSPORT: ${{ inputs.target_transport }}
      JUDGE_TRANSPORT: ${{ inputs.judge_transport }}
      EVAL_CASES: ${{ inputs.cases }}
      EVAL_ALL: ${{ inputs.all }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install

      - name: Validate corpus
        run: bun run eval:validate

      - name: Materialize optional OpenCode auth
        shell: bash
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_AUTH_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-auth"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            echo "OPENCODE_EVAL_RUNNER_AUTH=$RUNNER_TEMP/loom-opencode-auth/auth.json" >> "$GITHUB_ENV"
          fi

      - name: Run isolated live evals
        uses: bateau84/opencode-eval-runner@main
        with:
          engine: docker
          prepare-opencode: ${{ inputs.target_transport == 'opencode' || inputs.judge_transport == 'opencode' }}
          prepare-copilot: ${{ inputs.target_transport == 'github-copilot-cli' || inputs.judge_transport == 'github-copilot-cli' }}
          artifact-dir: .loom-evals
          command: |
            args=(
              python3 scripts/run-evals.py
              --engine docker
              --model "$EVAL_MODEL"
              --target-transport "$TARGET_TRANSPORT"
              --judge-transport "$JUDGE_TRANSPORT"
            )
            if [[ -n "$JUDGE_MODEL" ]]; then
              args+=(--judge-model "$JUDGE_MODEL")
            fi
            if [[ "$EVAL_ALL" == "true" ]]; then
              args+=(--all)
            else
              args+=(--cases "$EVAL_CASES")
            fi
            "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loom-live-evals
          path: .loom-evals/
          if-no-files-found: warn
