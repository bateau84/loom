name: Loom Live Behavioral Evals

on:
  push:
    branches: [feat/restore-diagnostic-root-cause]
  workflow_dispatch:
    inputs:
      model:
        description: Target model. OpenCode uses provider/model; Copilot CLI uses its model name.
        required: true
        type: string
      judge_model:
        description: Optional judge model. Required when judge transport differs from target transport.
        required: false
        type: string
      reasoning:
        description: Optional reasoning level applied to both target and judge unless overridden.
        required: false
        default: ""
        type: string
      target_reasoning:
        description: Optional target-only reasoning override.
        required: false
        default: ""
        type: string
      judge_reasoning:
        description: Optional judge-only reasoning override.
        required: false
        default: ""
        type: string
      target_transport:
        description: Target model transport. Skill-owned suites support OpenCode or GitHub Copilot; native skill-routing cases require OpenCode.
        required: true
        default: opencode
        type: choice
        options:
          - opencode
          - github-copilot-cli
      judge_transport:
        description: Judge model transport
        required: true
        default: opencode
        type: choice
        options:
          - opencode
          - github-copilot-cli
      target_kind:
        description: Limit the run to agent cases, skill cases, or both
        required: true
        default: all
        type: choice
        options:
          - all
          - agent
          - skill
      target:
        description: Optional comma-separated agent or skill names. Skill names discover every *.json under skills/<skill>/evals/.
        required: false
        default: ""
        type: string
      cases:
        description: Optional comma-separated case IDs. Combines with target_kind/target when supplied.
        required: false
        default: ""
        type: string
      all:
        description: Run the full behavioral corpus
        required: true
        default: false
        type: boolean
      iterations:
        description: Number of repetitions per selected case
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  copilot-requests: write

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVAL_MODEL: ${{ inputs.model }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      EVAL_REASONING: ${{ inputs.reasoning }}
      TARGET_REASONING: ${{ inputs.target_reasoning }}
      JUDGE_REASONING: ${{ inputs.judge_reasoning }}
      TARGET_TRANSPORT: ${{ inputs.target_transport }}
      JUDGE_TRANSPORT: ${{ inputs.judge_transport }}
      EVAL_TARGET_KIND: ${{ inputs.target_kind }}
      EVAL_TARGET: ${{ inputs.target }}
      EVAL_CASES: ${{ inputs.cases }}
      EVAL_ALL: ${{ inputs.all }}
      EVAL_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Validate corpus
        run: bun run eval:validate

      - name: Materialize optional OpenCode auth
        shell: bash
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_AUTH_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-auth"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-auth/auth.json"
            echo "OPENCODE_EVAL_RUNNER_AUTH=$RUNNER_TEMP/loom-opencode-auth/auth.json" >> "$GITHUB_ENV"
          fi

      - name: Materialize optional OpenCode model catalog
        shell: bash
        env:
          OPENCODE_MODELS_JSON: ${{ secrets.OPENCODE_MODELS_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENCODE_MODELS_JSON:-}" ]]; then
            install -m 700 -d "$RUNNER_TEMP/loom-opencode-models"
            printf '%s' "$OPENCODE_MODELS_JSON" > "$RUNNER_TEMP/loom-opencode-models/models.json"
            chmod 600 "$RUNNER_TEMP/loom-opencode-models/models.json"
            echo "OPENCODE_EVAL_RUNNER_MODELS=$RUNNER_TEMP/loom-opencode-models/models.json" >> "$GITHUB_ENV"
          fi

      - name: Run isolated live evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        uses: bateau84/opencode-eval-runner@ad4d6a26fc137202e4f35f2a14503f53b81991ca
        with:
          engine: docker
          opencode-image: ghcr.io/bateau84/opencode-eval-runner@sha256:68ef7322c75aede0e8cc76d0e3531e8b82dd417bbb5e5100264a89eab7fe8627
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:ab10a2865d0cf76306b8a3a07bbf446612c8524e09b197ad82b7d8698e90c477
          prepare-opencode: ${{ inputs.target_transport == 'opencode' || inputs.judge_transport == 'opencode' }}
          prepare-copilot: ${{ inputs.target_transport == 'github-copilot-cli' || inputs.judge_transport == 'github-copilot-cli' }}
          artifact-dir: .loom-evals
          command: |
            args=(
              python3 scripts/run-evals.py
              --engine docker
              --model "$EVAL_MODEL"
              --target-transport "$TARGET_TRANSPORT"
              --judge-transport "$JUDGE_TRANSPORT"
              --target-kind "$EVAL_TARGET_KIND"
              --iterations "$EVAL_ITERATIONS"
            )
            if [[ -n "$EVAL_TARGET" ]]; then
              args+=(--target "$EVAL_TARGET")
            fi
            if [[ -n "$JUDGE_MODEL" ]]; then
              args+=(--judge-model "$JUDGE_MODEL")
            fi
            if [[ -n "$EVAL_REASONING" ]]; then
              args+=(--reasoning "$EVAL_REASONING")
            fi
            if [[ -n "$TARGET_REASONING" ]]; then
              args+=(--target-reasoning "$TARGET_REASONING")
            fi
            if [[ -n "$JUDGE_REASONING" ]]; then
              args+=(--judge-reasoning "$JUDGE_REASONING")
            fi
            if [[ -n "${OPENCODE_API_KEY:-}" ]]; then
              args+=(--env OPENCODE_API_KEY)
            fi
            if [[ "$EVAL_ALL" == "true" ]]; then
              args+=(--all)
            elif [[ -n "$EVAL_CASES" ]]; then
              args+=(--cases "$EVAL_CASES")
            fi
            "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loom-live-evals
          path: .loom-evals/
          if-no-files-found: warn
          include-hidden-files: true



  diagnostic-readiness:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run eval:validate

      - name: Run Diagnostic Product Readiness evals
        uses: bateau84/opencode-eval-runner@ad4d6a26fc137202e4f35f2a14503f53b81991ca
        with:
          engine: docker
          prepare-opencode: false
          prepare-copilot: true
          copilot-image: ghcr.io/bateau84/opencode-eval-runner@sha256:ab10a2865d0cf76306b8a3a07bbf446612c8524e09b197ad82b7d8698e90c477
          artifact-dir: .loom-evals
          command: |
            python3 scripts/run-evals.py \
              --engine docker \
              --model gpt-5.4 \
              --judge-model gpt-5.4 \
              --target-transport github-copilot-cli \
              --judge-transport github-copilot-cli \
              --target-kind agent \
              --target diagnostic \
              --iterations 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-product-readiness
          path: .loom-evals/
          if-no-files-found: warn
          include-hidden-files: true
