name: Installed OpenCode boot-only regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - name: Pack and install the exact candidate artifact
        env:
          npm_config_cache: ${{ runner.temp }}/loom-npm-cache
        run: |
          mkdir -p "$RUNNER_TEMP/loom-plugin-artifact"
          npm pack --json --pack-destination "$RUNNER_TEMP/loom-plugin-artifact" > "$RUNNER_TEMP/loom-plugin-artifact/pack.json"
          ARTIFACT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/loom-plugin-artifact/pack.json")
          npm install --prefix "$RUNNER_TEMP/loom-plugin-install" --no-audit --no-fund "$RUNNER_TEMP/loom-plugin-artifact/$ARTIFACT"
      - name: Install exact external host separately from plugin dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/loom-npm-cache
        run: npm install --prefix "$RUNNER_TEMP/loom-opencode-host" --no-audit --no-fund @opencode/cli@2.2.0
      - name: Native agent preservation, empty boot, restart and removal; no model requests
        run: >-
          python3 tests/installed_host_smoke.py
          --opencode "$RUNNER_TEMP/loom-opencode-host/node_modules/.bin/opencode"
          --expect-version 2.2.0
          --plugin "$RUNNER_TEMP/loom-plugin-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-plugin-artifact" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --expect-sdk-version 2.2.0
          --report-directory "$RUNNER_TEMP/loom-host-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-host-boot-${{ github.sha }}
          path: ${{ runner.temp }}/loom-host-report/
          if-no-files-found: warn
          retention-days: 7
