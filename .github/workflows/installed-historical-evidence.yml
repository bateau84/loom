name: Installed historical engineering evidence
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  historical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - name: Pack and install exact Loom candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loom-historical-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/loom-historical-package" > "$RUNNER_TEMP/loom-historical-package/pack.json"
          ARTIFACT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/loom-historical-package/pack.json")
          npm install --prefix "$RUNNER_TEMP/loom-historical-install" --no-audit --no-fund "$RUNNER_TEMP/loom-historical-package/$ARTIFACT"
      - name: Install unmodified pinned OpenCode 2.3.0
        run: npm install --prefix "$RUNNER_TEMP/loom-historical-host" --no-audit --no-fund @opencode/cli@2.3.0
      - name: Verify installed historical evidence through registered native tools
        run: >-
          python3 tests/installed_historical_evidence.py
          --opencode "$RUNNER_TEMP/loom-historical-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-historical-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-historical-package" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --repository "$GITHUB_WORKSPACE"
          --expect-head "${{ github.event.pull_request.head.sha }}"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --report-directory "$RUNNER_TEMP/loom-historical-installed-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-historical-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/loom-historical-installed-report/
          if-no-files-found: warn
          retention-days: 7
