name: Installed question production-path qualification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  questions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - name: Mandatory COMPONENT SDK-get rejection, not installed ACL evidence
        run: bun test tests/question-host/get-rejection.test.ts
      - name: Pack and install the exact 2.1.1 candidate artifact
        run: |
          mkdir -p "$RUNNER_TEMP/loom-question-artifact"
          npm pack --json --pack-destination "$RUNNER_TEMP/loom-question-artifact" > "$RUNNER_TEMP/loom-question-artifact/pack.json"
          ARTIFACT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/loom-question-artifact/pack.json")
          npm install --prefix "$RUNNER_TEMP/loom-question-install" --no-audit --no-fund "$RUNNER_TEMP/loom-question-artifact/$ARTIFACT"
      - name: Install exact isolated unmodified OpenCode 2.1.1
        run: npm install --prefix "$RUNNER_TEMP/loom-question-host" --no-audit --no-fund @opencode/cli@2.1.1
      # T1 prepares the real candidate path. T2 owns executing and reviewing this
      # packed-candidate E2E; this workflow definition alone proves no scenario.
      - name: Real production questions, resume, full_thread and native duplicate countercheck
        run: >-
          python3 tests/installed_questions.py
          --opencode "$RUNNER_TEMP/loom-question-host/node_modules/.bin/opencode"
          --plugin "$RUNNER_TEMP/loom-question-install/node_modules/loom-plugin"
          --artifact "$(find "$RUNNER_TEMP/loom-question-artifact" -maxdepth 1 -name 'loom-plugin-*.tgz' -print -quit)"
          --expect-plugin-version "$(node -p 'require("./package.json").version')"
          --expect-sdk-version 2.1.1
          --report-directory "$RUNNER_TEMP/loom-question-report"
          --repository "$GITHUB_WORKSPACE"
          --duplicate-input-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-question-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/loom-question-report/
          if-no-files-found: warn
          retention-days: 7
