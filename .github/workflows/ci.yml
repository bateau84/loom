name: Loom plugin CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TEMPORARY: regenerate the lock on an isolated CI runner and emit it so
      # the PR can be repaired without silently trusting stale tarball hashes.
      - name: Prepare regenerated 2.1.1 lockfile
        run: |
          rm bun.lock
          bun install
          echo 'LOOM_LOCK_B64_BEGIN'
          base64 -w0 bun.lock
          echo
          echo 'LOOM_LOCK_B64_END'
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - run: bun run typecheck
      - name: Typecheck external scripted provider fixture (not production code)
        run: >-
          ./node_modules/.bin/tsc --noEmit --ignoreConfig --target ES2022 --module NodeNext
          --moduleResolution NodeNext --strict --skipLibCheck --types bun,node tests/question-host/server.ts tests/question-host/get-rejection.test.ts
      - run: bun run test:core
      - run: bun run test:native
      - name: Install pinned search implementation outside plugin dependencies
        run: npm install --prefix "$RUNNER_TEMP/loom-tool-search" --ignore-scripts --no-audit --no-fund @opencode/codemode@2.0.29
      - name: Verify real Code Mode search returns registered Loom help; no model requests
        run: LOOM_CODEMODE_ROOT="$RUNNER_TEMP/loom-tool-search" bun test tests/tool-search-codemode.test.ts
      - run: git diff --exit-code -- package.json bun.lock
      - run: bun run test:python
      - name: Build real production module graph (fixtures excluded)
        run: bun build server.ts --target=bun --external @opencode/plugin --outfile "$RUNNER_TEMP/loom-server.js"
      - name: Generate portable populated old prerequisite without Git objects
        run: bun tests/fixtures/baseline-c9ffcfa/generate.ts "$RUNNER_TEMP/loom-old-generated"
      - name: Characterize bounded YAML decoding examples
        run: bun tools/probe-config-decoding.ts
      - name: Check three review mutants and two reverse-fix controls; no inference
        run: python3 tools/check-review-regressions.py --report-directory "$RUNNER_TEMP/loom-review-regressions"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-regression-counterchecks-${{ github.sha }}
          path: ${{ runner.temp }}/loom-review-regressions/
          if-no-files-found: warn
          retention-days: 7
