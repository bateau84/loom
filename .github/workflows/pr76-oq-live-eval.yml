name: PR 76 OQ Live Eval

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  copilot-requests: write

jobs:
  oq-live-eval:
    if: github.head_ref == 'fix/oq-not-message-bus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Validate corpus
        run: bun run eval:validate

      - name: Run OQ message-bus regression
        uses: bateau84/opencode-eval-runner@e59d6d016e5b33bdf9832d8808512bd007fa49e1
        with:
          engine: docker
          prepare-opencode: false
          prepare-copilot: true
          artifact-dir: .loom-evals
          command: |
            python3 scripts/run-evals.py \
              --engine docker \
              --model gpt-5.4 \
              --judge-model gpt-5.4 \
              --target-transport github-copilot-cli \
              --judge-transport github-copilot-cli \
              --target-kind agent \
              --cases OQ-NOT-MESSAGE-BUS-01 \
              --iterations 1
